<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d0f10">
    <meta name="description" content="Fivefold, a free daily five-letter word puzzle.">
    <title>Fivefold</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <h1>Fivefold</h1>
      <button id="stats-button" class="stats-button" type="button">Stats</button>
    </header>

    <main class="game" aria-labelledby="game-heading">
      <h2 id="game-heading" class="visually-hidden">Daily five-letter puzzle</h2>
      <p id="message" class="message" role="status" aria-live="polite" aria-atomic="true"></p>
      <section id="board" class="board" role="grid" aria-label="Guess board" aria-rowcount="6" aria-colcount="5"></section>
      <section id="keyboard" class="keyboard" aria-label="On-screen keyboard"></section>
      <aside id="answer-card" class="answer-card" aria-labelledby="answer-card-word" hidden>
        <p id="answer-card-label" class="answer-card-label" hidden>
          Daily note <span aria-hidden="true">&bull;</span> <time id="answer-card-date"></time>
        </p>
        <h3 id="answer-card-word" class="answer-card-word"></h3>
        <p id="answer-card-definition" class="answer-card-definition"></p>
        <div id="share-controls" class="share-controls" hidden>
          <button id="share-button" class="share-button" type="button">Share result</button>
          <p id="share-status" class="share-status" role="status" aria-live="polite" aria-atomic="true"></p>
          <label id="share-manual-label" class="visually-hidden" for="share-manual">
            Share result text. Select and copy the text below manually.
          </label>
          <textarea id="share-manual" class="share-manual" aria-labelledby="share-manual-label" readonly hidden></textarea>
        </div>
      </aside>

      <div class="companion-dock">
        <button
          id="companion-toggle"
          class="companion-tab"
          type="button"
          aria-expanded="false"
          aria-controls="companion-desk"
        >Companion</button>
        <aside id="companion-desk" class="companion-desk" aria-labelledby="companion-desk-heading" hidden>
          <div class="companion-desk-sheet">
            <h2 id="companion-desk-heading">Companion Desk</h2>
            <p class="companion-desk-intro">Pass the puzzle between Fivefold and any companion chat.</p>
            <ol class="companion-steps">
              <li>Copy the game state.</li>
              <li>Paste your companion’s reply.</li>
              <li>Submit their guess.</li>
            </ol>
            <button id="companion-copy" class="companion-button" type="button">Copy for companion</button>
            <label id="companion-manual-label" class="visually-hidden" for="companion-manual">
              Game state for your companion. Select and copy the text below manually.
            </label>
            <textarea id="companion-manual" class="companion-textarea companion-manual" aria-labelledby="companion-manual-label" readonly hidden></textarea>
            <label class="companion-reply-label" for="companion-reply">Paste your companion’s reply</label>
            <textarea id="companion-reply" class="companion-textarea" placeholder="FIVEFOLD_GUESS: crane"></textarea>
            <button id="companion-submit" class="companion-button companion-submit" type="button">Submit companion guess</button>
            <p id="companion-status" class="companion-status" role="status" aria-live="polite" aria-atomic="true"></p>
          </div>
        </aside>
      </div>
    </main>

    <dialog id="stats-dialog" class="stats-dialog" aria-labelledby="stats-heading">
      <div class="stats-heading-row">
        <h2 id="stats-heading">Statistics</h2>
        <button id="stats-close" class="stats-close" type="button" aria-label="Close statistics dialog">&times;</button>
      </div>
      <div id="stats-summary" class="stats-summary"></div>
      <h3>Guess distribution</h3>
      <div id="guess-distribution" class="guess-distribution"></div>
    </dialog>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
